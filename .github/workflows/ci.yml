name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Node 20 and 22, deliberately not 24: ganache's bundled µWS binary is
    # incompatible with Node 24 and forces a non-zero exit even when every
    # assertion passes. 20 is the declared floor in package.json; testing both
    # is what caught the native-module failure on 22.
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts matches npm 12's default on the dev machine, and it is
      # required here: ganache drags in ancient native modules (keccak,
      # secp256k1, leveldown, @trufflesuite/bigint-buffer) whose node-gyp builds
      # compile on Node 20 but fail on Node 22's V8. Ganache has JS fallbacks for
      # all of them, so skipping the builds is safe and faster.
      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Unit tests (keccak, decoding, checks, domains)
        run: npm test

      - name: Rebuild the contract artifact and fail if it is stale
        run: |
          npm run build:contract
          git diff --exit-code -- contracts/artifacts docs/artifacts

      - name: Contract tests on an in-process EVM
        run: npm run test:contract

  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lib/forge-std is a git submodule; without this the build has no
          # forge-std and every test fails to import.
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      # `--deny warnings` turns the lints into errors. The contract is lint-clean
      # (the two deliberate suppressions are documented inline), so this stays
      # green while catching new ones.
      - run: forge build --deny warnings
      - run: forge test -vv

  live:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund

      # The check that matters most: every address the tool trusts is asked for
      # directly on mainnet and testnet. A wrong address fails the build.
      - name: Verify published Arc addresses on both chains
        run: npm run check:live
